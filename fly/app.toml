# Runs the published FreeBooks image - there is nothing to build:
#
#   fly deploy --config fly/app.toml --app <app>
#
# The app is named on each command rather than in this file: the names are
# yours to choose, and Fly app names are unique across all of Fly.
#
# One-time setup before the first deploy:
#   fly apps create <app>
#   fly volumes create freebooks_data --app <app> --region lhr --size 6
#   fly secrets set -a <app> DB_HOST=<db-app>.internal DB_USER=freebooks DB_PASSWORD=<same-as-db-app>
#   fly certs add fb.your.domain.com -a <app>
#
# To update, change the image tag below and deploy again. A release line such
# as 1.0 takes its newest version on each deploy; an exact version such as
# 1.0.0 stays put until you change it.
#
# Fly Machines only support one volume mount per Machine, so config/ and
# my_files/ share a single volume, mounted at fly_data/. The image's entrypoint
# seeds it on first boot and links config/ and my_files/ into it.

primary_region = "lhr"

[build]
  image = "ghcr.io/billj9000/freebooks:1.0"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "freebooks_data"
  destination = "/var/www/html/fly_data"

[env]
  DB_NAME = "freebooks"
