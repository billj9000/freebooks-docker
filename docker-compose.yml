networks:
  db:
    driver: bridge

services:
  php-app:
    build: ./php-app  # Builds the PHP app Docker image from the ./php-app directory
    ports:
      - "80:80"
    depends_on:
      - db  # Ensures MySQL starts before the PHP app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - config:/var/www/html/config/
      - my_files:/var/www/html/my_files/
    networks:
      db:

  db: # N.B. THIS is the database SERVER name
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Disable "strict" mode (the default)
    command: mariadbd --sql_mode="" #--character-set-server=utf8 --collation-server=utf8_slovenian_ci --init-connect='SET NAMES UTF8;' --innodb-flush-log-at-trx-commit=0
    ports:
      - "33060:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      db:

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "40002:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    networks:
      db:

volumes:
  mariadb:
    external: true
    name: freebooks_mariadb  # existing data volume from previous project
  config:
    external: true
    name: freebooks_config   # existing configure.php volume
  my_files:
    external: true
    name: freebooks_my_files # existing company data volume
