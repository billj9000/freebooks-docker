networks:
  db:
    driver: bridge

services:
  php-app:
    # The published FreeBooks image. FREEBOOKS_VERSION in .env picks the release:
    # an exact version (1.0.1), a release line (1.0) or edge (latest master).
    image: ghcr.io/billj9000/freebooks:${FREEBOOKS_VERSION:-1.0}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - db  # Ensures MySQL starts before the PHP app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # NB FB_EMPTY_COLUMN_COERCE is deliberately NOT set here.
      #
      # FreeBooks logs it to my_files/empty_column_writes.log whenever it hands a
      # blank value to a column that is not a string - a date or a number - which
      # a database at its default settings refuses. Setting this variable would
      # additionally write the column's own default so that the save proceeds.
      #
      # That is a developer's tool, not a setting to run an installation with: it
      # quietly repairs the very writes worth knowing about, and it stores a value
      # nobody asked for. If a save fails this way, the log names the table, the
      # column and the line of code, and that is a bug to report rather than to
      # paper over.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - config:/var/www/html/config/
      - my_files:/var/www/html/my_files/
    networks:
      db:

  db: # N.B. THIS is the database SERVER name
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # LOCAL ONLY — production is deliberately different, see fly/db.toml.
    #
    # Strict mode, which is what a stock MariaDB does and therefore what any
    # other install, copy target or new deployment will do. It was disabled
    # here, and that silence is what let three bugs in the company copy and the
    # backup engine survive unnoticed (issue #66) and let rows be written that
    # their own columns forbid. Pinned to 11.4's own default rather than left
    # implicit so it cannot drift with an image upgrade.
    #
    # This is a TRIAL, from 2026-08-22: it surfaces the places FreeBooks writes
    # '' into a date or a number, each of which is a real bug for anyone
    # installing on a stock server. Fly production stays lax meanwhile, so those
    # are found here and not by a customer. Do not sync the two.
    command: mariadbd --sql_mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" #--character-set-server=utf8 --collation-server=utf8_slovenian_ci --init-connect='SET NAMES UTF8;' --innodb-flush-log-at-trx-commit=0
    ports:
      - "33060:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      db:

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "40002:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    networks:
      db:

volumes:
  mariadb:
  config:
  my_files:
