networks:
  db:
    driver: bridge

services:
  php-app:
    build: ./php-app  # Builds the PHP app Docker image from the ./php-app directory
    ports:
      - "80:80"
    depends_on:
      - db  # Ensures MySQL starts before the PHP app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # LOCAL ONLY, and only because this database is strict (see the db service
      # below). db_perform() always LOGS an '' handed to a non-string column; with
      # this set it also writes the column's default so the save proceeds, which
      # is what keeps the strict trial usable. Production leaves it unset: there
      # the server is lax and coercing would change what gets stored.
      FB_EMPTY_COLUMN_COERCE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - config:/var/www/html/config/
      - my_files:/var/www/html/my_files/
    networks:
      db:

  db: # N.B. THIS is the database SERVER name
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # LOCAL ONLY — production is deliberately different, see fly/db.toml.
    #
    # Strict mode, which is what a stock MariaDB does and therefore what any
    # other install, copy target or new deployment will do. It was disabled
    # here, and that silence is what let three bugs in the company copy and the
    # backup engine survive unnoticed (issue #66) and let rows be written that
    # their own columns forbid. Pinned to 11.4's own default rather than left
    # implicit so it cannot drift with an image upgrade.
    #
    # This is a TRIAL, from 2026-08-22: it surfaces the places FreeBooks writes
    # '' into a date or a number, each of which is a real bug for anyone
    # installing on a stock server. Fly production stays lax meanwhile, so those
    # are found here and not by a customer. Do not sync the two.
    command: mariadbd --sql_mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" #--character-set-server=utf8 --collation-server=utf8_slovenian_ci --init-connect='SET NAMES UTF8;' --innodb-flush-log-at-trx-commit=0
    ports:
      - "33060:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      db:

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "40002:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    networks:
      db:

volumes:
  mariadb:
    external: true
    name: freebooks_mariadb  # existing data volume from previous project
  config:
    external: true
    name: freebooks_config   # existing configure.php volume
  my_files:
    external: true
    name: freebooks_my_files # existing company data volume
