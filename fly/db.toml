# No build context needed — deploys the public mariadb image directly.
# Deploy with (run from the repo root, or anywhere):
#
#   fly deploy --config fly/db.toml --app <db-app>
#
# One-time setup before the first deploy:
#   fly apps create <db-app>
#   fly volumes create mariadb_data --app <db-app> --region lhr --size 5
#   fly secrets set -a <db-app> \
#     MYSQL_ROOT_PASSWORD=<pick-one> \
#     MYSQL_USER=freebooks \
#     MYSQL_PASSWORD=<same-as-app's DB_PASSWORD>
#
# Not publicly exposed — reachable from other apps in this Fly org at
# <db-app>.internal:3306.

primary_region = "lhr"

[build]
  image = "mariadb:11.4"

[[mounts]]
  source = "mariadb_data"
  destination = "/var/lib/mysql"

[env]
  MYSQL_DATABASE = "freebooks"

# STRICT, to match docker-compose.yml - switched 2026-10-02.
#
# FreeBooks used to write '' where a NULL, a number or a zero-date belongs, and a
# strict server refuses the whole INSERT rather than coercing it. The local
# docker database ran strict from 2026-08-22 to find and fix those write paths,
# and production stayed lax until the 1.0.0 release had run on it with the
# empty-column log (my_files/empty_column_writes.log) recording nothing.
#
# If a write is refused here, the fix is in the code, not in this line.
#
# Editing this line is the ONLY way to change production's sql_mode: deploying
# fly/app.toml targets the <app> machine and never restarts or
# reconfigures this one - the two are separate Fly apps with separate configs.
[processes]
  app = "mariadbd --sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"
